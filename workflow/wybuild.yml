# wybuild-workflow-version: 2
name: WyBuild Build
concurrency:
  group: wybuild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
run-name: "WyBuild ${{ inputs.build_target }}/${{ inputs.build_mode }}/${{ inputs.flutter_version }} on ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: apk | appbundle | split-per-abi
        type: string
        default: apk
      build_mode:
        description: debug | profile | release
        type: string
        default: release
      flutter_version:
        description: stable | beta | exact version such as 3.29.0
        type: string
        default: stable
      dart_defines:
        description: JSON array of KEY=VALUE strings
        type: string
        default: "[]"
      obfuscate:
        type: string
        default: "false"
      split_debug_info:
        type: string
        default: "false"
      run_tests:
        type: string
        default: "false"
      custom_args:
        type: string
        default: ""
      use_keystore:
        type: string
        default: "false"
      timeout_minutes:
        description: 15 minutes on Free, 60 minutes on Pro
        type: string
        default: "15"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    env:
      BUILD_TARGET: ${{ inputs.build_target }}
      BUILD_MODE: ${{ inputs.build_mode }}
      DART_DEFINES: ${{ inputs.dart_defines }}
      OBFUSCATE: ${{ inputs.obfuscate }}
      SPLIT_DEBUG: ${{ inputs.split_debug_info }}
      RUN_TESTS: ${{ inputs.run_tests }}
      CUSTOM_ARGS: ${{ inputs.custom_args }}
      USE_KEYSTORE: ${{ inputs.use_keystore }}
      WB_KEYSTORE_BASE64: ${{ secrets.WB_KEYSTORE_BASE64 }}
      WB_KEYSTORE_PASSWORD: ${{ secrets.WB_KEYSTORE_PASSWORD }}
      WB_KEY_ALIAS: ${{ secrets.WB_KEY_ALIAS }}
      WB_KEY_PASSWORD: ${{ secrets.WB_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (channel)
        if: ${{ inputs.flutter_version == 'stable' || inputs.flutter_version == 'beta' }}
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_version }}
          cache: true

      - name: Set up Flutter (pinned version)
        if: ${{ inputs.flutter_version != 'stable' && inputs.flutter_version != 'beta' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run tests
        if: ${{ inputs.run_tests == 'true' }}
        run: flutter test

      - name: Configure release signing
        if: ${{ inputs.use_keystore == 'true' }}
        run: |
          set -euo pipefail
          test -n "$WB_KEYSTORE_BASE64" || { echo "::error::WB_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$WB_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/wb-release.jks"
          {
            echo "storePassword=$WB_KEYSTORE_PASSWORD"
            echo "keyPassword=$WB_KEY_PASSWORD"
            echo "keyAlias=$WB_KEY_ALIAS"
            echo "storeFile=$GITHUB_WORKSPACE/android/app/wb-release.jks"
          } > "$GITHUB_WORKSPACE/android/key.properties"

      - name: Build
        run: |
          set -euo pipefail
          args=()
          case "$BUILD_TARGET" in
            apk) cmd=apk ;;
            appbundle) cmd=appbundle ;;
            split-per-abi) cmd=apk; args+=(--split-per-abi) ;;
            *) echo "::error::Unknown build target"; exit 1 ;;
          esac
          case "$BUILD_MODE" in
            debug|profile|release) args+=("--$BUILD_MODE") ;;
            *) echo "::error::Unknown build mode"; exit 1 ;;
          esac
          if [ -n "$DART_DEFINES" ] && [ "$DART_DEFINES" != "[]" ]; then
            while IFS= read -r d; do args+=("--dart-define=$d"); done < <(printf '%s' "$DART_DEFINES" | jq -r '.[]')
          fi
          if [ "$OBFUSCATE" = "true" ]; then
            args+=(--obfuscate --split-debug-info=build/symbols)
          elif [ "$SPLIT_DEBUG" = "true" ]; then
            args+=(--split-debug-info=build/symbols)
          fi
          if [ -n "$CUSTOM_ARGS" ]; then
            read -r -a extra <<< "$CUSTOM_ARGS"
            args+=("${extra[@]}")
          fi
          flutter build "$cmd" "${args[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wb-build-${{ github.run_id }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/**/*.aab
            build/symbols/**
          if-no-files-found: error
