<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>WyBuild is offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #020617; color: #e2e8f0; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
  main { max-width: 360px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #94a3b8; margin: 0 0 20px; }
  button { height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: #6ee7b7; color: #06100c; font: 600 15px inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="" width="72" height="72">
  <h1>You're offline</h1>
  <p>WyBuild needs a connection to reach GitHub and your builds. Reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
